[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "magica-voxel-mcp"
version = "0.1.1"
description = "Local, atomic voxel editing with MagicaVoxel VOX and six orthographic PNG views over MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.3,<3",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "Pillow>=11,<13",
  "portalocker>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

[project.scripts]
voxel-mcp = "voxel_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

